<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="iconmoi.jpg"> 
  <link rel="manifest" href="manifest.json">
  <title>CherryPet Notebook — Ý tưởng Content</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    /* 🎨 Biến CSS & Chuẩn iOS System Design */
    :root {
      --bg-main: #f2f2f7;
      --card-bg: #ffffff;
      --accent-color: #007aff;
      --accent-pink: #ff2d55;
      --muted-color: #8e8e93;
      --text-color: #000000;
      --border-color: rgba(60, 60, 67, 0.12);
      
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-sheet: 28px;
      
      --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.04);
      --shadow-active: 0 8px 24px rgba(0, 0, 0, 0.12);
      --shadow-float: 0 8px 32px rgba(0, 122, 255, 0.3);

      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background-color: var(--bg-main);
      color: var(--text-color);
      padding-bottom: 100px; /* Chừa khoảng trống cho Floating Action Button */
      min-height: 100vh;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    /* 🚀 iOS Header Cố định */
    header { 
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 16px;
      background: rgba(242, 242, 247, 0.85);
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 0.5px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .app-brand i {
      color: var(--accent-pink);
    }

    .count-badge {
      background: rgba(255, 45, 85, 0.12);
      color: var(--accent-pink);
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* 🔍 Thanh Tìm kiếm iOS Style */
    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted-color);
      font-size: 14px;
    }

    .search-box input {
      width: 100%;
      border: none;
      background: rgba(118, 118, 128, 0.12);
      padding: 9px 12px 9px 34px;
      border-radius: 10px;
      font-size: 15px;
      color: var(--text-color);
      outline: none;
      transition: background 0.2s;
    }

    .search-box input:focus {
      background: rgba(118, 118, 128, 0.18);
    }

    /* 📦 Main Container */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    /* 📝 Note Card Item */
    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-card);
      border: 0.5px solid var(--border-color);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item:active {
      transform: scale(0.985);
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .item-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-color);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-pending {
      background: #fff0f2;
      color: var(--accent-pink);
    }

    .status-completed {
      background: #e4f9ec;
      color: #34c759;
    }

    .item-body {
      font-size: 14px;
      line-height: 1.45;
      color: #3a3a3c;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .item-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-badge {
      font-size: 11px;
      background: rgba(0, 122, 255, 0.08);
      color: var(--accent-color);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 500;
    }

    .item-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 0.5px solid rgba(0, 0, 0, 0.05);
      margin-top: 4px;
    }

    .time-stamp {
      font-size: 11px;
      color: var(--muted-color);
    }

    .action-group {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      background: var(--bg-main);
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-action.toggle {
      background: rgba(0, 122, 255, 0.1);
      color: var(--accent-color);
    }

    .btn-action.toggle.done {
      background: rgba(52, 199, 89, 0.1);
      color: #34c759;
    }

    .btn-action.delete {
      background: rgba(255, 59, 48, 0.1);
      color: #ff3b30;
    }

    .btn-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(0, 0, 0, 0.04);
      color: var(--accent-color);
      text-decoration: none;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 🎛️ Floating Add Button (Nút nổi iOS) */
    .fab-btn {
      position: fixed;
      bottom: 24px;
      right: 20px;
      background: var(--accent-pink);
      color: white;
      width: 56px;
      height: 56px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: var(--shadow-float);
      border: none;
      cursor: pointer;
      z-index: 99;
      transition: transform 0.2s;
    }

    .fab-btn:active {
      transform: scale(0.9);
    }

    /* 📜 iOS Bottom Sheet Modal (Form ghi chú) */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .sheet-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .sheet-content {
      background: #ffffff;
      width: 100%;
      max-width: 600px;
      border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
      padding: 20px 20px 30px 20px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
      max-height: 90vh;
      overflow-y: auto;
    }

    .sheet-overlay.active .sheet-content {
      transform: translateY(0);
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .sheet-title {
      font-size: 18px;
      font-weight: 700;
    }

    .btn-close {
      background: rgba(118, 118, 128, 0.12);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-color);
      cursor: pointer;
    }

    /* 🏷️ Form Elements iOS Style */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted-color);
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .form-group input, 
    .form-group textarea {
      width: 100%;
      border: 1px solid var(--border-color);
      background: #f9f9f9;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 15px;
      color: var(--text-color);
      outline: none;
      font-family: inherit;
    }

    .form-group input:focus, 
    .form-group textarea:focus {
      border-color: var(--accent-pink);
      background: #ffffff;
    }

    .form-group textarea {
      min-height: 110px;
      resize: vertical;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-pink);
      color: white;
      border: none;
      padding: 14px;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(255, 45, 85, 0.25);
    }

    .btn-submit:active {
      opacity: 0.9;
    }

    /* Blank State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted-color);
    }

    .empty-state i {
      font-size: 40px;
      margin-bottom: 10px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <!-- 🚀 Header -->
  <header>
    <div class="header-top">
      <div class="app-brand">
        <i class="fas fa-paw"></i>
        <span>CherryPet Note</span>
      </div>
      <div class="count-badge" id="pendingBadge">0 chưa quay</div>
    </div>
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input id="searchInput" type="text" placeholder="Tìm tiêu đề, nội dung, hashtag..." />
    </div>
  </header>

  <!-- 📦 Container Danh sách -->
  <div class="container">
    <div class="list" id="noteList">
      <!-- Item render tự động ở đây -->
    </div>
  </div>

  <!-- 🎛️ Nút tạo ghi chú nhanh (Nổi góc dưới) -->
  <button class="fab-btn" id="openFormBtn">
    <i class="fas fa-plus"></i>
  </button>

  <!-- 📜 Form Nhập Content (iOS Bottom Sheet) -->
  <div class="sheet-overlay" id="sheetOverlay">
    <div class="sheet-content">
      <div class="sheet-header">
        <div class="sheet-title" id="formTitle">Tạo ý tưởng mới</div>
        <button class="btn-close" id="closeFormBtn"><i class="fas fa-times"></i></button>
      </div>

      <div class="form-group">
        <label>Tiêu đề Content</label>
        <input id="titleInput" placeholder="Ví dụ: Review Raccoon Lego ăn táo..." />
      </div>

      <div class="form-group">
        <label>Link đính kèm (TikTok/Drive/Video mẫu)</label>
        <input id="linkUrlInput" type="url" placeholder="https://vt.tiktok.com/..." />
      </div>

      <div class="form-group">
        <label>Chi tiết kịch bản / Nội dung Note</label>
        <textarea id="bodyInput" placeholder="Nội dung ý tưởng, câu hook, góc quay..."></textarea>
      </div>

      <div class="form-group">
        <label>Hashtag / Tags (phân cách bằng dấu phẩy)</label>
        <input id="tagsInput" placeholder="raccoon, hai huoc, khach" />
      </div>

      <button class="btn-submit" id="saveBtn">Lưu Ý Tưởng</button>
    </div>
  </div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import {
      getDatabase, ref, push, set, onValue, remove, update
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC4k2DyiEVKXcMpc_j9XwqZG1OHHBNegDk",
      authDomain: "lichnghi-4c665.firebaseapp.com",
      databaseURL: "https://lichnghi-4c665-default-rtdb.firebaseio.com",
      projectId: "lichnghi-4c665",
      storageBucket: "lichnghi-4c665.firebasestorage.app",
      messagingSenderId: "86673813509",
      appId: "1:86673813509:web:168376408dfcbf14e16c6c",
      measurementId: "G-2G08MRQY1V"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const contentsRef = ref(db, "contents");

    // Tên Kênh Mặc Định Duy Nhất
    const FIXED_CATEGORY = "CherryPet";

    // DOM Elements
    const noteList = document.getElementById("noteList");
    const searchInput = document.getElementById("searchInput");
    const pendingBadge = document.getElementById("pendingBadge");

    const sheetOverlay = document.getElementById("sheetOverlay");
    const openFormBtn = document.getElementById("openFormBtn");
    const closeFormBtn = document.getElementById("closeFormBtn");

    const titleInput = document.getElementById("titleInput");
    const linkUrlInput = document.getElementById("linkUrlInput");
    const bodyInput = document.getElementById("bodyInput");
    const tagsInput = document.getElementById("tagsInput");
    const saveBtn = document.getElementById("saveBtn");
    const formTitle = document.getElementById("formTitle");

    let editingKey = null;
    let localNotes = {};

    function nowISO() { return new Date().toISOString(); }

    // Mở Modal Sheet Form
    function openSheet(editKey = null) {
      editingKey = editKey;
      if (editingKey && localNotes[editingKey]) {
        const item = localNotes[editingKey];
        titleInput.value = item.title || "";
        linkUrlInput.value = item.linkUrl || "";
        bodyInput.value = item.body || "";
        tagsInput.value = (item.tags || []).join(", ");
        formTitle.textContent = "Chỉnh sửa ý tưởng";
        saveBtn.textContent = "Cập nhật";
      } else {
        titleInput.value = "";
        linkUrlInput.value = "";
        bodyInput.value = "";
        tagsInput.value = "";
        formTitle.textContent = "Tạo ý tưởng mới";
        saveBtn.textContent = "Lưu Ý Tưởng";
      }
      sheetOverlay.classList.add("active");
    }

    // Đóng Modal Sheet Form
    function closeSheet() {
      sheetOverlay.classList.remove("active");
      editingKey = null;
    }

    openFormBtn.onclick = () => openSheet();
    closeFormBtn.onclick = closeSheet;
    sheetOverlay.onclick = (e) => {
      if (e.target === sheetOverlay) closeSheet();
    };

    // Lưu hoặc Cập nhật Content
    async function saveContent() {
      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();
      const linkUrl = linkUrlInput.value.trim();

      if (!title && !body && !linkUrl) {
        alert("Vui lòng nhập ít nhất tiêu đề, nội dung hoặc link.");
        return;
      }

      const tags = tagsInput.value.split(",").map(t => t.trim()).filter(Boolean);

      const data = {
        category: FIXED_CATEGORY, // Luôn cố định là CherryPet
        title,
        body,
        tags,
        linkUrl,
        updatedAt: nowISO()
      };

      if (editingKey) {
        await update(ref(db, "contents/" + editingKey), data);
      } else {
        await set(push(contentsRef), {
          ...data,
          createdAt: nowISO(),
          isCompleted: false
        });
      }

      closeSheet();
    }

    saveBtn.onclick = saveContent;

    // Xóa note
    async function removeNote(key) {
      if (confirm("Xoá nội dung này khỏi danh sách?")) {
        await remove(ref(db, "contents/" + key));
      }
    }

    // Đổi trạng thái Quay xong / Chưa xong
    async function toggleCompleted(key, currentStatus) {
      await update(ref(db, "contents/" + key), {
        isCompleted: !currentStatus,
        updatedAt: nowISO() // Cập nhật thời gian để sắp xếp chuẩn
      });
    }

    // Render danh sách Note ra giao diện (Sắp xếp MỚI NHẤT LÊN ĐẦU)
    function renderNotes(query = "") {
      noteList.innerHTML = "";
      const q = query.toLowerCase().trim();

      let uncompletedCount = 0;

      // Chuyển object Firebase thành Array để xử lý sắp xếp
      const notesArray = Object.entries(localNotes)
        .filter(([key, item]) => {
          // Chỉ lấy nội dung của CherryPet (hoặc tất cả các ghi chú cũ)
          const searchContent = (item.title || "") + " " + (item.body || "") + " " + (item.tags || []).join(" ") + " " + (item.linkUrl || "");
          if (q && !searchContent.toLowerCase().includes(q)) return false;

          if (!item.isCompleted) uncompletedCount++;
          return true;
        })
        .sort((a, b) => {
          const itemA = a[1];
          const itemB = b[1];

          const isCompletedA = itemA.isCompleted || false;
          const isCompletedB = itemB.isCompleted || false;

          // 1. Ưu tiên Chưa quay nằm trên, Đã quay nằm dưới
          if (isCompletedA !== isCompletedB) {
            return isCompletedA ? 1 : -1;
          }

          // 2. Trong cùng nhóm: NỘI DUNG MỚI/CẬP NHẬT GẦN NHẤT XẾP TRÊN CÙNG
          const timeA = new Date(itemA.updatedAt || itemA.createdAt || 0).getTime();
          const timeB = new Date(itemB.updatedAt || itemB.createdAt || 0).getTime();

          return timeB - timeA; // Mới hơn lên đầu
        });

      // Cập nhật Badge số lượng chưa hoàn thành
      pendingBadge.textContent = `${uncompletedCount} chưa quay`;

      if (notesArray.length === 0) {
        noteList.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-sticky-note"></i>
            <div>Chưa có ghi chú nào. Hãy tạo ghi chú mới!</div>
          </div>
        `;
        return;
      }

      // Render từng thẻ Card
      notesArray.forEach(([key, item]) => {
        const isCompleted = item.isCompleted || false;
        const statusText = isCompleted ? "Đã xong" : "Chưa quay";
        const statusClass = isCompleted ? "status-completed" : "status-pending";

        // Xử lý nút Link đính kèm
        let linkHTML = "";
        if (item.linkUrl) {
          let host = item.linkUrl.replace(/^https?:\/\//, '').split('/')[0];
          linkHTML = `
            <a href="${item.linkUrl}" target="_blank" rel="noopener noreferrer" class="btn-link">
              <i class="fas fa-link"></i> ${host}
            </a>
          `;
        }

        // Render Tag
        let tagsHTML = "";
        if (item.tags && item.tags.length > 0) {
          tagsHTML = `
            <div class="item-tags">
              ${item.tags.map(t => `<span class="tag-badge">#${t}</span>`).join("")}
            </div>
          `;
        }

        // Định dạng thời gian
        const dateObj = new Date(item.updatedAt || item.createdAt);
        const timeDisplay = dateObj.toLocaleDateString("vi-VN", {
          day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
        });

        const card = document.createElement("div");
        card.className = "item";
        card.innerHTML = `
          <div class="item-header">
            <div class="item-title">${item.title || "(Chưa có tiêu đề)"}</div>
            <span class="status-pill ${statusClass}">
              <i class="fas ${isCompleted ? 'fa-check-circle' : 'fa-clock'}"></i>
              ${statusText}
            </span>
          </div>

          ${item.body ? `<div class="item-body">${item.body}</div>` : ''}
          ${tagsHTML}
          ${linkHTML}

          <div class="item-footer">
            <span class="time-stamp">${timeDisplay}</span>
            <div class="action-group">
              <button class="btn-action toggle ${isCompleted ? 'done' : ''}" id="toggle-${key}">
                <i class="fas ${isCompleted ? 'fa-undo' : 'fa-check'}"></i>
                ${isCompleted ? 'Mở lại' : 'Đã quay'}
              </button>
              <button class="btn-action" id="edit-${key}">
                <i class="fas fa-pen"></i> Sửa
              </button>
              <button class="btn-action delete" id="del-${key}">
                <i class="fas fa-trash-alt"></i>
              </button>
            </div>
          </div>
        `;

        noteList.appendChild(card);

        // Gán sự kiện click cho các nút
        document.getElementById(`toggle-${key}`).onclick = () => toggleCompleted(key, isCompleted);
        document.getElementById(`edit-${key}`).onclick = () => openSheet(key);
        document.getElementById(`del-${key}`).onclick = () => removeNote(key);
      });
    }

    // Lắng nghe dữ liệu Firebase Realtime
    onValue(contentsRef, snap => {
      localNotes = snap.val() || {};
      renderNotes(searchInput.value);
    });

    // Sự kiện tìm kiếm nhanh
    searchInput.oninput = () => renderNotes(searchInput.value);

  </script>
</body>
</html>
